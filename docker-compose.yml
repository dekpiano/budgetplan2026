version: "3.8"

services:
  app:
    container_name: budgetplan2026_app
    build: .
    ports:
      - "8093:443"
    volumes:
      # Mount application code with delegated / cached strategy
      - .:/var/www/html:cached
    environment:
      # Database connection settings for CodeIgniter
      DB_HOST: skj2025_db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      # PHP Performance tuning
      PHP_MEMORY_LIMIT: 512M
      PHP_OPCACHE_ENABLE: 1
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
      PHP_OPCACHE_REVALIDATE_FREQ: 2
      PHP_REALPATH_CACHE_SIZE: 16384K
      PHP_REALPATH_CACHE_TTL: 1200
    dns:
      - 8.8.8.8
    networks:
      - skj2025_default
    # Mount high-write / high-access temporary directories to in-memory tmpfs
    tmpfs:
      - /tmp:size=512M,mode=1777
      - /var/cache:size=256M,mode=1777
      - /var/www/html/writable/cache:size=128M,mode=1777

networks:
  skj2025_default:
    external: true
